; ============================================================
;  Tamagotchi Spotify — configuración del proyecto
; ============================================================
;  Este archivo ES el entorno aislado (ADR-0001). Define qué
;  placa, qué framework y qué versión de cada librería usa el
;  proyecto. Gracias a esto se puede recompilar dentro de un
;  año y funcionar igual (RNF-04).
; ============================================================

[env:esp32dev]
; --- Qué placa es ---
; ESP32-D0WD-V3 rev 3.1, 4 MB de flash. Confirmado con esptool
; el 2026-08-29. "esp32dev" es el perfil genérico que le queda.
board       = esp32dev
platform    = espressif32
framework   = arduino

; --- Cómo se comunica con la Mac ---
upload_port   = /dev/cu.usbserial-0001   ; chip CP2102 (Silicon Labs)
monitor_port  = /dev/cu.usbserial-0001
monitor_speed = 115200

; esp32_exception_decoder traduce los errores del ESP32 de
; direcciones de memoria a nombres de función. Sin esto, un
; crash se ve como un volcado de números ilegible.
monitor_filters = esp32_exception_decoder, time

; Mete el commit de Git dentro del firmware. Sin esto, saber qué versión
; hay cargada en la placa es adivinar: el último commit puede ser posterior
; (compilaste sin cargar) o anterior (cargaste sin commitear).
extra_scripts = pre:version.py

; --- Certificados raíz (ADR-0009) ---
; El ESP32 no tiene "llavero" como una computadora: no confía en
; nadie porque no conoce a nadie. Este archivo es la lista de
; autoridades certificadoras de Mozilla, en el formato compacto
; que entiende el chip.  Se regenera con:
;     python3 tools/gen-cert-bundle.py
board_build.embed_files = data/cert/x509_crt_bundle.bin

; --- Librerías, con versión clavada (RNF-04) ---
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    bodmer/TFT_eSPI@2.5.43

; ============================================================
;  Configuración de la pantalla GMT130 (ADR-0008)
; ============================================================
;  Peculiaridad de TFT_eSPI: normalmente los pines se configuran
;  editando un archivo DENTRO de la librería (User_Setup.h). Eso
;  es horrible: la configuración vive fuera del proyecto, no se
;  versiona, y se pierde al reinstalar la librería.
;
;  Poniéndolos aquí como build_flags, toda la configuración vive
;  en el proyecto y queda en Git. Es lo que exige el RNF-04.
; ============================================================
build_flags =
    -D CORE_DEBUG_LEVEL=2       ; 0=nada 1=error 2=warn 3=info 5=todo

    -D USER_SETUP_LOADED=1      ; "no busques User_Setup.h, yo te lo doy"
    -D ST7789_DRIVER=1          ; el controlador confirmado en la plaquita
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET             ; los paneles 240x240 llevan un desplazamiento

    -D TFT_MOSI=23              ; SDA  <- datos
    -D TFT_SCLK=18              ; SCK  <- reloj
    -D TFT_CS=-1                ; sin CS: la GMT130 no lo trae (7 pines)
    -D TFT_DC=16                ; DC   <- ¿orden o dato?
    -D TFT_RST=4                ; RES  <- reset
    -D TFT_BL=32                ; BLK  <- luz de atrás
    -D TFT_BACKLIGHT_ON=HIGH

    -D LOAD_GLCD=1              ; fuentes: de la más chica...
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1             ; ...a la más grande
    -D LOAD_GFXFF=1             ; fuentes libres, suavizadas
    -D SMOOTH_FONT=1

    -D SPI_FREQUENCY=40000000   ; 40 MHz
