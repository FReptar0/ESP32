; ============================================================
;  Tamagotchi Spotify — configuración del proyecto
; ============================================================
;  Este archivo ES el entorno aislado (ADR-0001). Define qué
;  placa, qué framework y qué versión de cada librería usa el
;  proyecto. Gracias a esto se puede recompilar dentro de un
;  año y funcionar igual (RNF-04).
; ============================================================

[env:esp32dev]
; --- Qué placa es ---
; ESP32-D0WD-V3 rev 3.1, 4 MB de flash. Confirmado con esptool
; el 2026-08-29. "esp32dev" es el perfil genérico que le queda.
board       = esp32dev
platform    = espressif32
framework   = arduino

; --- Cómo se comunica con la Mac ---
upload_port = /dev/cu.usbserial-0001   ; chip CP2102 (Silicon Labs)
monitor_port = /dev/cu.usbserial-0001
monitor_speed = 115200                 ; debe coincidir con el Serial.begin() del código

; --- Filtros del monitor serie ---
; esp32_exception_decoder traduce los errores del ESP32 de
; direcciones de memoria a nombres de función. Sin esto, un
; crash se ve como un volcado de números ilegible.
monitor_filters = esp32_exception_decoder, time

build_flags =
    -D CORE_DEBUG_LEVEL=2   ; 0=nada 1=error 2=warn 3=info(verboso) 5=todo

; --- Certificados raíz (ADR-0009) ---
; El ESP32 no tiene "llavero" como una computadora: no confía en nadie
; porque no conoce a nadie. Este archivo es la lista de autoridades
; certificadoras de Mozilla, en el formato compacto que entiende el chip.
; Se genera con: python3 tools/gen-cert-bundle.py
board_build.embed_files = data/cert/x509_crt_bundle.bin

; --- Librerías, con versión clavada (RNF-04) ---
lib_deps =
    bblanchon/ArduinoJson@7.4.3
